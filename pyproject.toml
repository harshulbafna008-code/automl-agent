[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-agent"
version = "0.1.0"
description = "LLM-Guided AutoML Experimentation Agent (local-first, Ollama-powered)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "requests>=2.31",
    "joblib>=1.3",
    "rich>=13.0",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
